name: Release Lifecycle

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Owner-controlled release repository
        required: true
        default: kmccleary3301/kmcode
        type: string
      release_tag:
        description: Current stable fork release tag
        required: true
        default: fork-v0.0.48
        type: string
      previous_tag:
        description: Previous stable fork release tag
        required: true
        default: fork-v0.0.47
        type: string

permissions:
  contents: read

jobs:
  posix:
    name: POSIX ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            label: macOS arm64
            runner: macos-26
          - id: macos-x64
            label: macOS x64
            runner: macos-26-intel
          - id: linux-x64
            label: Linux x64
            runner: ubuntu-24.04
          - id: linux-arm64
            label: Linux arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout lifecycle harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Install stock Pi and OMP runtimes
        run: |
          npm install --global bun@1.3.14
          npm install --prefix .native/current --no-package-lock --no-save \
            @earendil-works/pi-coding-agent@0.84.4 \
            @oh-my-pi/pi-coding-agent@18.8.4
          test "$(.native/current/node_modules/.bin/pi --version)" = "0.84.4"
          test "$(.native/current/node_modules/.bin/omp --version)" = "omp/18.8.4"

      - name: Run stock native lifecycle matrix
        env:
          T3_NATIVE_PI_BINARY: ${{ github.workspace }}/.native/current/node_modules/.bin/pi
          T3_NATIVE_PI_PACKAGE_ROOT: ${{ github.workspace }}/.native/current/node_modules/@earendil-works/pi-coding-agent
          T3_NATIVE_PI_VERSION: 0.84.4
          T3_NATIVE_OMP_BINARY: ${{ github.workspace }}/.native/current/node_modules/.bin/omp
          T3_NATIVE_OMP_PACKAGE_ROOT: ${{ github.workspace }}/.native/current/node_modules/@oh-my-pi/pi-coding-agent
          T3_NATIVE_OMP_VERSION: 18.8.4
          T3_NATIVE_MATRIX_REPORT: ${{ runner.temp }}/stock-native-matrix-${{ matrix.id }}.raw.json
          T3_NATIVE_PROVENANCE_REPORT: ${{ runner.temp }}/stock-native-provenance-${{ matrix.id }}.json
          T3_LIFECYCLE_REPOSITORY: ${{ inputs.repository }}
          T3_LIFECYCLE_RELEASE_TAG: ${{ inputs.release_tag }}
          T3_LIFECYCLE_PREVIOUS_TAG: ${{ inputs.previous_tag }}
          T3_EVIDENCE_SOURCE_HEAD: ${{ github.sha }}
        run: |
          export T3_NATIVE_PI_INTEGRITY="$(npm view @earendil-works/pi-coding-agent@0.84.4 dist.integrity)"
          export T3_NATIVE_OMP_INTEGRITY="$(npm view @oh-my-pi/pi-coding-agent@18.8.4 dist.integrity)"
          node scripts/native-runtime-provenance.mjs
          vp test run apps/server/integration/nativeRuntimeLifecycle.integration.test.ts \
            --reporter=json \
            --outputFile="$T3_NATIVE_MATRIX_REPORT"

      - name: Sanitize native test evidence
        if: always()
        env:
          T3_EVIDENCE_SOURCE_HEAD: ${{ github.sha }}
          T3_NATIVE_PLATFORM: ${{ matrix.id }}
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/stock-native-matrix-$T3_NATIVE_PLATFORM.raw.json"
          if [[ -f "$input" ]]; then
            node apps/server/scripts/sanitize-vitest-evidence.mjs \
              "$input" \
              "$RUNNER_TEMP/stock-native-matrix-$T3_NATIVE_PLATFORM.json" \
              stock-native-matrix \
              "$T3_EVIDENCE_SOURCE_HEAD"
          fi

      - name: Run release lifecycle
        env:
          T3_LIFECYCLE_REPOSITORY: ${{ inputs.repository }}
          T3_LIFECYCLE_RELEASE_TAG: ${{ inputs.release_tag }}
          T3_LIFECYCLE_PREVIOUS_TAG: ${{ inputs.previous_tag }}
          T3_LIFECYCLE_REPORT: ${{ runner.temp }}/release-lifecycle-${{ matrix.id }}.json
          T3_LIFECYCLE_INSTALLED_NATIVE_REPORT: ${{ runner.temp }}/installed-native-${{ matrix.id }}.json
          T3_LIFECYCLE_INSTALLED_NATIVE_TEST_REPORT: ${{ runner.temp }}/installed-native-test-${{ matrix.id }}.raw.json
        run: |
          export T3_LIFECYCLE_NATIVE_ROOT="$HOME"
          export T3_NATIVE_PI_BINARY="$PWD/.native/current/node_modules/.bin/pi"
          export T3_NATIVE_OMP_BINARY="$PWD/.native/current/node_modules/.bin/omp"
          sh scripts/release-lifecycle-posix.sh

      - name: Sanitize installed native test evidence
        if: always()
        env:
          T3_EVIDENCE_SOURCE_HEAD: ${{ github.sha }}
          T3_NATIVE_PLATFORM: ${{ matrix.id }}
        run: |
          input="$RUNNER_TEMP/installed-native-test-$T3_NATIVE_PLATFORM.raw.json"
          if [[ -f "$input" ]]; then
            node apps/server/scripts/sanitize-vitest-evidence.mjs \
              "$input" \
              "$RUNNER_TEMP/installed-native-test-$T3_NATIVE_PLATFORM.json" \
              installed-native-test \
              "$T3_EVIDENCE_SOURCE_HEAD"
          fi

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-lifecycle-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/release-lifecycle-${{ matrix.id }}.json
            ${{ runner.temp }}/stock-native-matrix-${{ matrix.id }}.json
            ${{ runner.temp }}/stock-native-provenance-${{ matrix.id }}.json
            ${{ runner.temp }}/installed-native-${{ matrix.id }}.json
            ${{ runner.temp }}/installed-native-test-${{ matrix.id }}.json
          if-no-files-found: ignore
          retention-days: 30

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout lifecycle harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Install stock Pi and OMP runtimes
        shell: pwsh
        run: |
          npm install --global bun@1.3.14
          if ($LASTEXITCODE -ne 0) {
            throw "bun installation failed with exit code $LASTEXITCODE"
          }
          npm install --prefix .native/current --no-package-lock --no-save `
            @earendil-works/pi-coding-agent@0.84.4 `
            @oh-my-pi/pi-coding-agent@18.8.4
          if ($LASTEXITCODE -ne 0) {
            throw "npm runtime installation failed with exit code $LASTEXITCODE"
          }
          $piVersion = (& .native/current/node_modules/.bin/pi.cmd --version).Trim()
          $ompVersion = (& .native/current/node_modules/.bin/omp.cmd --version).Trim()
          if ($piVersion -ne "0.84.4" -or $ompVersion -ne "omp/18.8.4") {
            throw "Unexpected native runtime versions: pi $piVersion, $ompVersion"
          }

      - name: Run stock native lifecycle matrix
        shell: pwsh
        env:
          T3_NATIVE_PI_VERSION: 0.84.4
          T3_NATIVE_OMP_VERSION: 18.8.4
          T3_NATIVE_MATRIX_REPORT: ${{ runner.temp }}/stock-native-matrix-windows.raw.json
          T3_NATIVE_PROVENANCE_REPORT: ${{ runner.temp }}/stock-native-provenance-windows.json
          T3_LIFECYCLE_REPOSITORY: ${{ inputs.repository }}
          T3_LIFECYCLE_RELEASE_TAG: ${{ inputs.release_tag }}
          T3_LIFECYCLE_PREVIOUS_TAG: ${{ inputs.previous_tag }}
          T3_EVIDENCE_SOURCE_HEAD: ${{ github.sha }}
        run: |
          $env:T3_NATIVE_PI_BINARY = (Resolve-Path ".native/current/node_modules/.bin/pi.cmd").Path
          $env:T3_NATIVE_OMP_BINARY = (Resolve-Path ".native/current/node_modules/.bin/omp.cmd").Path
          $env:T3_NATIVE_PI_PACKAGE_ROOT = (Resolve-Path ".native/current/node_modules/@earendil-works/pi-coding-agent").Path
          $env:T3_NATIVE_OMP_PACKAGE_ROOT = (Resolve-Path ".native/current/node_modules/@oh-my-pi/pi-coding-agent").Path
          $env:T3_NATIVE_PI_INTEGRITY = (npm view @earendil-works/pi-coding-agent@0.84.4 dist.integrity).Trim()
          $env:T3_NATIVE_OMP_INTEGRITY = (npm view @oh-my-pi/pi-coding-agent@18.8.4 dist.integrity).Trim()
          node scripts/native-runtime-provenance.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "Native runtime provenance failed with exit code $LASTEXITCODE"
          }
          vp test run `
            apps/server/integration/nativeRuntimeLifecycle.integration.test.ts `
            --reporter=json `
            "--outputFile=$env:T3_NATIVE_MATRIX_REPORT"
          if ($LASTEXITCODE -ne 0) {
            throw "Native lifecycle matrix failed with exit code $LASTEXITCODE"
          }

      - name: Sanitize native test evidence
        if: always()
        shell: pwsh
        env:
          T3_EVIDENCE_SOURCE_HEAD: ${{ github.sha }}
        run: |
          $inputPath = Join-Path $env:RUNNER_TEMP "stock-native-matrix-windows.raw.json"
          if (Test-Path $inputPath) {
            node apps/server/scripts/sanitize-vitest-evidence.mjs `
              $inputPath `
              (Join-Path $env:RUNNER_TEMP "stock-native-matrix-windows.json") `
              stock-native-matrix `
              $env:T3_EVIDENCE_SOURCE_HEAD
            if ($LASTEXITCODE -ne 0) {
              throw "Native evidence sanitization failed with exit code $LASTEXITCODE"
            }
          }
      - name: Run release lifecycle
        shell: pwsh
        env:
          T3_LIFECYCLE_REPOSITORY: ${{ inputs.repository }}
          T3_LIFECYCLE_RELEASE_TAG: ${{ inputs.release_tag }}
          T3_LIFECYCLE_PREVIOUS_TAG: ${{ inputs.previous_tag }}
          T3_LIFECYCLE_REPORT: ${{ runner.temp }}/release-lifecycle-windows.json
          T3_LIFECYCLE_INSTALLED_NATIVE_REPORT: ${{ runner.temp }}/installed-native-windows.json
          T3_LIFECYCLE_INSTALLED_NATIVE_TEST_REPORT: ${{ runner.temp }}/installed-native-test-windows.raw.json
        run: |
          $env:T3_LIFECYCLE_NATIVE_ROOT = Join-Path $env:RUNNER_TEMP "t3-pi-omp-native-state-windows"
          $env:T3_NATIVE_PI_BINARY = (Resolve-Path ".native/current/node_modules/.bin/pi.cmd").Path
          $env:T3_NATIVE_OMP_BINARY = (Resolve-Path ".native/current/node_modules/.bin/omp.cmd").Path
          ./scripts/release-lifecycle-windows.ps1

      - name: Sanitize installed native test evidence
        if: always()
        shell: pwsh
        env:
          T3_EVIDENCE_SOURCE_HEAD: ${{ github.sha }}
        run: |
          $inputPath = Join-Path $env:RUNNER_TEMP "installed-native-test-windows.raw.json"
          if (Test-Path $inputPath) {
            node apps/server/scripts/sanitize-vitest-evidence.mjs `
              $inputPath `
              (Join-Path $env:RUNNER_TEMP "installed-native-test-windows.json") `
              installed-native-test `
              $env:T3_EVIDENCE_SOURCE_HEAD
            if ($LASTEXITCODE -ne 0) {
              throw "Installed native evidence sanitization failed with exit code $LASTEXITCODE"
            }
          }

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-lifecycle-windows
          path: |
            ${{ runner.temp }}/release-lifecycle-windows.json
            ${{ runner.temp }}/stock-native-matrix-windows.json
            ${{ runner.temp }}/stock-native-provenance-windows.json
            ${{ runner.temp }}/installed-native-windows.json
            ${{ runner.temp }}/installed-native-test-windows.json
          if-no-files-found: ignore
          retention-days: 30
